 <script>
 function postwith (to,p) {
	  var myForm = document.createElement("form");
	  myForm.method="post" ;
	  myForm.action = to ;
	  for (var k in p) {
	    var myInput = document.createElement("input") ;
	    myInput.setAttribute("name", k) ;
	    myInput.setAttribute("value", p[k]);
	    myForm.appendChild(myInput) ;
	  }
	  document.body.appendChild(myForm) ;
	  myForm.submit() ;
	  document.body.removeChild(myForm) ;
}

 function pokazLogin(){
	 	  var loginBox = prompt("Please enter your password");
		  if (loginBox!=null)
		  {
		  	postwith ("index.php",{'password':loginBox});
		  }
 }
 </script>
 <script type="text/javascript">
 	function akcja(event){
 	
	 	if($(event.target).parent().hasClass('schowany')){
	 		$(event.target).parent().removeClass('schowany');
	 		}
	 	else {$(event.target).parent().addClass('schowany');}
 	}
 </script>
